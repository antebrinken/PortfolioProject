  <rect width="1200" height="630" fill="transparent" filter="url(#grain)"/>
  <text x="50%" y="590" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Arial" font-size="18" fill="#9ca3af">Replace this image with a real screenshot at public/projects/last-todo.png</text>
