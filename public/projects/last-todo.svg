<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0b0b0b"/>
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="url(#g)" opacity="0.12"/>
  <g transform="translate(120,110)">
    <rect x="0" y="0" width="960" height="420" rx="14" fill="#101010" stroke="#2a2a2a"/>
    <rect x="0" y="0" width="960" height="58" rx="14" fill="#0f172a"/>
    <circle cx="26" cy="29" r="6" fill="#ef4444"/>
    <circle cx="46" cy="29" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="29" r="6" fill="#22c55e"/>
    <text x="90" y="36" font-family="Inter, Segoe UI, Roboto, Arial" font-size="18" fill="#e5e7eb">The Last TODO</text>

    <g transform="translate(36,96)">
      <rect x="0" y="0" width="300" height="46" rx="8" fill="#111827" stroke="#1f2937"/>
      <text x="16" y="30" font-family="Inter, Segoe UI, Roboto, Arial" font-size="16" fill="#9ca3af">Add a new task...</text>
      <rect x="316" y="0" width="98" height="46" rx="8" fill="#22c55e"/>
      <text x="345" y="30" font-family="Inter, Segoe UI, Roboto, Arial" font-size="16" fill="#0b0b0b">Add</text>

      <g transform="translate(0,84)">
        <rect x="0" y="0" width="414" height="44" rx="8" fill="#0b1220" stroke="#1f2937"/>
        <rect x="12" y="10" width="24" height="24" rx="6" fill="#1f2937"/>
        <text x="48" y="28" font-family="Inter, Segoe UI, Roboto, Arial" font-size="16" fill="#e5e7eb">Finish portfolio project</text>
      </g>
      <g transform="translate(0,140)">
        <rect x="0" y="0" width="414" height="44" rx="8" fill="#0b1220" stroke="#1f2937"/>
        <rect x="12" y="10" width="24" height="24" rx="6" fill="#1f2937"/>
        <text x="48" y="28" font-family="Inter, Segoe UI, Roboto, Arial" font-size="16" fill="#e5e7eb">Ship React Solitaire embed</text>
      </g>
      <g transform="translate(0,196)">
        <rect x="0" y="0" width="414" height="44" rx="8" fill="#0b1220" stroke="#1f2937"/>
        <rect x="12" y="10" width="24" height="24" rx="6" fill="#1f2937"/>
        <text x="48" y="28" font-family="Inter, Segoe UI, Roboto, Arial" font-size="16" fill="#e5e7eb">Refactor components</text>
